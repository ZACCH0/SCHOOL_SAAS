# T16 close-out: GitHub Actions runs the checks on every push.
# The gates mirror the local working loop (AGENTS.md section 7):
# check, makemigrations --check, then the full pytest suite against a real
# PostgreSQL service so tenant rules and SQL constraints are exercised.

name: tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DB_NAME: school_saas
      DB_USER: school_saas
      DB_PASSWORD: school_saas
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      LOG_LEVEL: INFO

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: school_saas
          POSTGRES_USER: school_saas
          POSTGRES_PASSWORD: school_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest -q
