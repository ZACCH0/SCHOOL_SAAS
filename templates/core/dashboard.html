{% extends "base.html" %}
{% block title %}Choose account{% endblock %}
{% block content %}
<div class="mx-auto max-w-md rounded-xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
  <h1 class="text-xl font-bold">Choose how to continue</h1>
  {% if error %}
    <p class="mt-3 rounded bg-red-50 p-3 text-sm text-red-700">{{ error }}</p>
  {% endif %}
  <div class="mt-4 space-y-3">
    {% for membership in memberships %}
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="membership_id" value="{{ membership.pk }}">
        <button type="submit"
                class="w-full rounded-lg border border-slate-300 px-4 py-3 text-left hover:border-indigo-500">
          <span class="block font-medium">{{ membership.school.name }}</span>
          <span class="block text-sm text-slate-500">{{ membership.get_role_display }}</span>
        </button>
      </form>
    {% empty %}
      <p class="text-slate-600">Your account is not linked to any school yet.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
