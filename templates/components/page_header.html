<div class="mb-6 flex flex-wrap items-end justify-between gap-3">
  <div>
    {% if crumb %}<p class="mb-1 text-sm text-slate-500">{{ crumb }}</p>{% endif %}
    <h1 class="text-2xl font-bold tracking-tight">{{ title }}</h1>
    {% if subtitle %}<p class="mt-1 text-slate-600">{{ subtitle }}</p>{% endif %}
  </div>
  {% if action_url %}
    <a href="{{ action_url }}" class="rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700">{{ action_label }}</a>
  {% endif %}
</div>
