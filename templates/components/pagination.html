{% if page_obj.paginator.num_pages > 1 %}
  <nav class="mt-4 flex items-center justify-between text-sm" aria-label="Pagination">
    <span class="text-slate-500">Showing {{ page_obj.start_index }} to {{ page_obj.end_index }} of {{ page_obj.paginator.count }}</span>
    <div class="flex gap-2">
      {% if page_obj.has_previous %}
        <a href="?page={{ page_obj.previous_page_number }}" class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 font-semibold text-brand-700">Previous</a>
      {% endif %}
      {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}" class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 font-semibold text-brand-700">Next</a>
      {% endif %}
    </div>
  </nav>
{% endif %}
