<div class="rounded-2xl bg-white p-10 text-center shadow-sm ring-1 ring-line">
  <h2 class="text-lg font-bold">{{ title }}</h2>
  {% if text %}<p class="mx-auto mt-2 max-w-md text-slate-600">{{ text }}</p>{% endif %}
  {% if action_url %}
    <a href="{{ action_url }}" class="mt-5 inline-block rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700">{{ action_label }}</a>
  {% endif %}
</div>
