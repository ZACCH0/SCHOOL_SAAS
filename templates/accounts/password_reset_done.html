{% extends "base.html" %}

{% block title %}Check your email{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm rounded-xl bg-white p-6 shadow-sm ring-1 ring-line">
  <h1 class="text-xl font-bold">Check your email</h1>
  <p class="mt-2 text-sm text-slate-600">
    If an account exists for that email, we have sent a link to reset the password.
    It may take a few minutes to arrive.
  </p>
  <p class="mt-4 text-sm"><a href="{% url 'accounts:login' %}" class="font-medium text-brand-700 hover:underline">Back to log in</a></p>
</div>
{% endblock %}
