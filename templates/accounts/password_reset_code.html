{% extends "base.html" %}

{% block title %}Enter your code{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm rounded-xl bg-white p-6 shadow-sm ring-1 ring-line">
  <h1 class="text-xl font-bold">Enter your code</h1>
  <p class="mt-2 text-sm text-slate-600">
    Type the 6-digit code we sent you. It works once and expires in 10 minutes.
  </p>
  {% if error %}
    <p class="mt-3 rounded bg-red-50 p-3 text-sm text-red-700">{{ error }}</p>
  {% endif %}
  <form method="post" class="mt-4 space-y-4">
    {% csrf_token %}
    <div>
      <label for="id_code" class="block text-sm font-medium">6-digit code</label>
      <input type="text" name="code" id="id_code" required autofocus
             inputmode="numeric" autocomplete="one-time-code" maxlength="6"
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-lg tracking-widest focus:border-brand-600 focus:outline-none">
    </div>
    <button type="submit"
            class="w-full rounded-lg bg-brand-600 px-4 py-2 font-medium text-white hover:bg-brand-700">
      Continue
    </button>
  </form>
  <p class="mt-4 text-sm"><a href="{% url 'accounts:password_reset' %}" class="font-medium text-brand-700 hover:underline">Ask for a new code</a></p>
</div>
{% endblock %}
