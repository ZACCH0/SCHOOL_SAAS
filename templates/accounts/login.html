{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm rounded-xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
  <h1 class="text-xl font-bold">Log in</h1>
  <form method="post" class="mt-4 space-y-4">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% if form.errors %}
      <p class="rounded bg-red-50 p-3 text-sm text-red-700">
        Wrong username or password. Please try again.
      </p>
    {% endif %}
    <div>
      <label for="id_username" class="block text-sm font-medium">Username</label>
      <input type="text" name="username" id="id_username" required autofocus
             autocomplete="username" value="{{ form.username.value|default_if_none:'' }}"
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none">
    </div>
    <div>
      <label for="id_password" class="block text-sm font-medium">Password</label>
      <input type="password" name="password" id="id_password" required
             autocomplete="current-password"
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none">
    </div>
    <button type="submit"
            class="w-full rounded-lg bg-indigo-600 px-4 py-2 font-medium text-white hover:bg-indigo-700">
      Log in
    </button>
  </form>
</div>
{% endblock %}
