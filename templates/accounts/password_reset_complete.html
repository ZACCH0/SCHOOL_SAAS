{% extends "base.html" %}

{% block title %}Password changed{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm rounded-xl bg-white p-6 shadow-sm ring-1 ring-line">
  <h1 class="text-xl font-bold">Password changed</h1>
  <p class="mt-2 text-sm text-slate-600">You can now log in with your new password.</p>
  <a href="{% url 'accounts:login' %}"
     class="mt-4 inline-block rounded-lg bg-brand-600 px-4 py-2 font-medium text-white hover:bg-brand-700">
    Log in
  </a>
</div>
{% endblock %}
