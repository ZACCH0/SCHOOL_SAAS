<ul class="space-y-1">
  {% for item in nav_items %}
    <li>
      <a href="{{ item.url }}" {% if item.active %}aria-current="page"{% endif %}
         class="block rounded-lg px-3 py-2 text-sm font-semibold {% if item.active %}bg-brand-50 text-brand-700{% else %}text-slate-600 hover:bg-white{% endif %}">
        {{ item.label }}
      </a>
    </li>
  {% endfor %}
</ul>
